---
DATA_LOADER:
  BATCH_SIZE: 200
  NUM_WORKERS: 24
ENV:
  # Random seed candidates: 42, 514229
  RANDOM_SEED: 42
MODEL:
  NAME: "resnet"
  EXTRA:
    NUM_RESNET_LAYERS: 50
    NUM_CHANNEL_PER_KP: 28
    FINAL_CONV_KERNEL_SIZE: 1
TRAIN:
  END_EPOCH: 140
  LOGGING_EPOCH_PERF: true
  LR: 0.001
  LR_FACTOR: 0.1
  LR_STEP: [90, 120]
  SAVE_CHECKPOINTS: true
  SAVE_BEST_MODEL: true
